# Proprietà globali di Gradle, Kotlin e Android per tutto il progetto.
# Kotlin: stile di codice ufficiale e memoria massima del demone del compilatore.
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
# Gradle: memoria del demone e codifica UTF-8 dei sorgenti; configuration cache e build cache rendono più
# veloci le build successive alla prima.
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# Android: ogni modulo vede nella sua classe R solo le proprie risorse, e si usano le librerie AndroidX.
android.nonTransitiveRClass=true
android.useAndroidX=true