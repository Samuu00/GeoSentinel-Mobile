# Workflow di integrazione continua (GitHub Actions). A ogni push su main e su ogni pull request esegue tre job
# indipendenti: build e test di Android su Ubuntu, compilazione e test del codice condiviso per iOS su macOS, e
# la ricerca di segreti (chiavi, password, token) in tutta la storia del repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Il token del workflow ha solo il permesso di leggere il codice.
permissions:
  contents: read

# Un nuovo push sulla stessa pull request o sullo stesso branch annulla la run precedente ancora in corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job Android: test host del modulo shared e build dell'app in debug e in release.
  android:
    name: Android (build + test host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # JDK 21 di Azul (Zulu), lo stesso indicato in gradle/gradle-daemon-jvm.properties: con un'altra versione
      # Gradle scaricherebbe un JDK a ogni run.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      # Cache di Gradle: viene scritta solo dalle run su main, le pull request la leggono soltanto.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Una sola invocazione di Gradle, così la configurazione del progetto si paga una volta. I test host comprendono
      # anche quelli di UI con Robolectric; la build release passa da R8.
      - run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:assembleRelease

  # Job iOS: compila il codice Kotlin per il simulatore e ne esegue i test; serve macOS.
  ios:
    name: iOS (compilazione + test sul simulatore)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # Se fallisce con "Invalid device", il simulatore predefinito di Kotlin non esiste nell'immagine del runner: va
      # indicato il dispositivo nel blocco kotlin di shared.
      - run: ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:iosSimulatorArm64Test

  # Job dei segreti, come nel backend: gitleaks scansiona tutta la storia (fetch-depth 0) a ogni push e pull
  # request e fallisce se trova chiavi, password o token.
  secrets:
    name: Segreti (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Binario a versione fissa con il checksum SHA-256 verificato prima dell'uso. Dependabot non aggiorna questi
      # valori: versione e checksum vanno cambiati a mano, insieme.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
