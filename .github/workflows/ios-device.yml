# Workflow manuale che produce l'app per un iPhone vero, senza firma, da installare dal PC Windows con xtool
# (istruzioni in tools/ios-device/README.md). Kotlin/Native non può creare il framework di shared su Windows o
# Linux: lo fa questo runner macOS, e xtool firma poi l'app con l'Apple ID dell'utente. Si avvia solo a mano
# (Actions, "iOS device build", Run workflow), perché i minuti macOS costano e l'URL del backend cambia con la
# rete del PC.
name: iOS device build

on:
  # Parametro richiesto all'avvio: l'indirizzo del backend come lo raggiunge l'iPhone.
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "URL del backend visto dall'iPhone (l'IP del PC in rete locale, es. http://192.168.1.20:8080)"
        required: true

# Il token del workflow ha solo il permesso di leggere il codice.
permissions:
  contents: read

jobs:
  ipa:
    name: App iOS non firmata (iosArm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # Questo workflow legge la cache di Gradle ma non la scrive.
          cache-read-only: true
      # La fase "Compile Kotlin Framework" del progetto Xcode chiama embedAndSignAppleFrameworkForXcode, che mette nel
      # bundle il framework e le risorse di Compose. La build è senza firma: la firma la aggiunge xtool con il profilo
      # dell'Apple ID (con un account gratuito le push restano spente, perché manca aps-environment).
      - name: Build
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          # Login con Google: client OAuth per iOS, letto dalla variabile del repository GOOGLE_IOS_CLIENT_ID. Se è vuota
          # il pulsante non compare. Lo script ricava anche il "reversed client ID" usato come schema URL di ritorno.
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          REVERSED_CLIENT_ID=geosentinel-google-non-configurato
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then
            REVERSED_CLIENT_ID="com.googleusercontent.apps.${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          fi
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            API_BASE_URL="$API_BASE_URL" \
            GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" GOOGLE_REVERSED_CLIENT_ID="$REVERSED_CLIENT_ID"
      # Un file .ipa è un archivio zip con l'app dentro la cartella Payload.
      - name: Pacchetto .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/Build/Products/Debug-iphoneos/*.app Payload/
          zip -qry GeoSentinel.ipa Payload
      # Il pacchetto resta scaricabile per 7 giorni come artefatto della run (lo scarica tools/ios-device/install.ps1).
      - uses: actions/upload-artifact@v4
        with:
          name: GeoSentinel-ipa
          path: GeoSentinel.ipa
          retention-days: 7
